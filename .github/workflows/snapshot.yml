name: snapshot

# 每日用 worker/worker.mjs 现场聚合，生成静态 m3u，供 EdgeOne Pages 托管镜像
on:
  schedule:
    - cron: '0 4 * * *' # UTC 04:00 = 北京时间 12:00，错开 02:00 的线路探测
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot.yml'
      - 'monitor/snapshot.mjs'
      - 'worker/worker.mjs'

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build snapshot
        run: node monitor/snapshot.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(snapshot): $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
