name: monitor

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor/check.mjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe streams
        run: node monitor/check.mjs --out .

      # GitHub 运行在境外机房，部分国内线路会被误判为不可用。
      # 若本次存活率比上次低 15 个百分点以上，判定为探测节点地域偏差，放弃覆盖。
      - name: Guard against vantage bias
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process");
            let old = 0;
            try { old = JSON.parse(cp.execSync("git show HEAD:status.json", { encoding: "utf8" })).aliveRate || 0; } catch {}
            const fresh = JSON.parse(fs.readFileSync("status.json", "utf8")).aliveRate || 0;
            console.log(`上次存活率 ${old}% → 本次 ${fresh}%`);
            if (old && fresh < old - 15) {
              console.error("存活率骤降，判定为探测节点地域偏差，放弃本次结果");
              process.exit(1);
            }
          '

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alive.m3u status.json
          if git diff --quiet --cached; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新线路有效性 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
